[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evbox-ble"
version = "0.1.2"
description = "Asynchronous local BLE communication with EVBox Gen4 chargers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Christopher Reimer"}]
dependencies = ["bleak-retry-connector>=4.7.0", "bleak>=1.0.1"]
classifiers = ["Framework :: AsyncIO", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/CReimer/evbox-ble"
Repository = "https://github.com/CReimer/evbox-ble"
Issues = "https://github.com/CReimer/evbox-ble/issues"

[project.optional-dependencies]
test = ["coverage>=7.10"]
quality = ["ruff==0.16.9", "mypy==2.4.0", "build>=1.6.1", "twine>=6.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/evbox_ble"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "README.md", "API.md", "CHANGELOG.md", "QUALITY.md", "LICENSE", "pyproject.toml"]

[tool.coverage.run]
branch = true
source = ["evbox_ble"]

[tool.coverage.report]
show_missing = true
fail_under = 100
precision = 2

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "ASYNC", "B"]
# These public APIs expose device-operation timeouts, not whole-task deadlines.
ignore = ["ASYNC109"]
